server:
  port: 3000

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fortress_chat}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: fortress-chat-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.fortress.chat.kafka

# Firebase
firebase:
  project-id: ${FIREBASE_PROJECT_ID:fortress-chat-3e3f8}
  # Path to service account JSON (optional — if not set, uses Application Default Credentials)
  service-account-path: ${FIREBASE_SA_PATH:}

# Rate limiter configuration
ratelimit:
  message:
    max-tokens: 10
    refill-rate: 1.0    # tokens per second
  sync:
    max-tokens: 5
    refill-rate: 0.1    # 1 token per 10 seconds

# CORS
cors:
  allowed-origins: "*"

# Logging
logging:
  level:
    com.fortress.chat: DEBUG
    org.springframework.web.socket: DEBUG
